# Spindle memory checks: structure, secrets and retrieval evals.
# Fails the build when the memory is broken, holds a secret, or finds less than it used to.
name: Spindle memory
on:
  pull_request:
    paths: ["spindle/**", ".github/skills/spindle/**", ".claude/skills/spindle/**"]
  push:
    branches: [main]
jobs:
  spindle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python .github/skills/spindle/scripts/spindle.py ci spindle
